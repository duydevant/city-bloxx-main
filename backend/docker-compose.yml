name: city-bloxx-backend
services:
  db:
    image: postgres:16-alpine
    container_name: city-bloxx-backend-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run node scripts/setup-local.cjs first}
      POSTGRES_DB: ${DB_DATABASE:-app_db}
    ports:
      - "127.0.0.1:${DB_PORT:-55433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-app_db}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: city-bloxx-backend-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-56380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: city-bloxx-backend-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-58026}:8025"

  migrate:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: city-bloxx-backend-api:local
    container_name: city-bloxx-backend-migrate
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment: &app-env
      DB_HOST: db
      DB_PORT: 5432
      APP_PORT: 3000
      REDIS_URL: redis://redis:6379
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      NODE_ENV: ${NODE_ENV:-local}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TS_NODE_BASEURL: dist
    command: ["sh", "-c", "node -r tsconfig-paths/register dist/src/cli.js migrate && node -r tsconfig-paths/register dist/src/cli.js seed"]
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: city-bloxx-backend-api:local
    container_name: city-bloxx-backend-api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    env_file: .env
    environment: *app-env
    ports:
      - "127.0.0.1:${APP_PORT:-31006}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 10

  test:
    profiles: [test]
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: builder
    image: city-bloxx-backend-test:local
    container_name: city-bloxx-backend-test
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    env_file: .env
    environment: *app-env
    command: ["node", "test/run-security.cjs"]

volumes:
  pgdata:
  redisdata:
