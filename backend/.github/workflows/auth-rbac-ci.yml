name: Auth RBAC
on: [push, pull_request]
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/setup-local.cjs
      - run: docker compose build api test
      - run: docker compose up -d db redis mailpit
      - run: docker compose --profile test run --rm test
      - run: docker compose --profile test run --rm test yarn typecheck
      - run: docker compose --profile test run --rm test yarn lint:check
      - if: always()
        run: docker compose down
