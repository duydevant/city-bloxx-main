# Run with: docker compose -f docker-compose.yml -f docker-compose.game.yml up -d --build
# The existing backend project name and database/Redis volumes are preserved.
services:
  api:
    environment:
      APP_TRUST_PROXY: "true"
      AUTH_ALLOWED_ORIGINS: ${GAME_AUTH_ALLOWED_ORIGINS:-http://localhost:56789,http://127.0.0.1:56789,http://localhost:3000,http://localhost:31005}
      FRONTEND_USER_PORTAL_URL: ${GAME_PUBLIC_URL:-http://localhost:56789}
  web:
    image: city-bloxx-web:local
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: node:22-alpine
        NEXT_PUBLIC_SITE_URL: ${GAME_PUBLIC_URL:-http://localhost:56789}
        NEXT_PUBLIC_SITE_NAME: City Bloxx
        NEXT_PUBLIC_API_BASE_URL: /api/v1
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
    restart: unless-stopped
  gateway:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${GAME_WEB_PORT:-56789}:8080"
    volumes:
      - ./gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped
